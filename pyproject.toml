[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "developer-harness"
version = "1.1.0"
description = "Model-neutral development workflows with evidence, continuity, and bounded execution."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Developer Harness contributors"}]
dependencies = []
keywords = ["agents", "development", "workflow", "harness", "evidence"]

[project.scripts]
dh = "developer_harness.cli:main"

[tool.setuptools.packages.find]
include = ["developer_harness*"]

[tool.setuptools.package-data]
developer_harness = ["resources/*.md", "resources/profiles/*.json", "resources/workflows/*.md", "resources/templates/*.md", "resources/schemas/*.json"]
