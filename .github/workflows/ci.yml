name: Validate Developer Harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Runnable complete example
        run: python examples/walkthrough.py
      - name: Distribution structure and links
        run: python scripts/release_check.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/harness-package-test
          /tmp/harness-package-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/harness-package-test/bin/dh capabilities
          /tmp/harness-package-test/bin/dh profiles
